[package]
name = "yura"
description = "Yura — an offline-first AI companion with a 3D face."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "yura"

[[bin]]
name = "yura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yura-core.workspace = true
yura-llm.workspace = true
yura-avatar.workspace = true
yura-store.workspace = true
yura-docs.workspace = true
yura-tools.workspace = true
yura-mcp.workspace = true

tauri = { version = "2", features = ["wry", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
